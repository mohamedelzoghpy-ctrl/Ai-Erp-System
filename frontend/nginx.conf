server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: /api/products -> backend:8000/products (same origin, so no CORS needed)
    location /api/ {
        # Resolve the Compose service dynamically so nginx can start before backend DNS is ready.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path serves index.html (never cache it).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
