services:
  - type: web
    name: ai-erp-system-staging-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./deploy/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "1"
      - key: ENABLE_DOCS
        value: "false"
      - key: CORS_ORIGINS
        value: https://ai-erp-system-staging-web.onrender.com
  - type: web
    name: ai-erp-system-staging-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-erp-system-staging-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
