services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: erp_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # نسخة احتياطية يومية مجدولة إلى ./backups (المجلد الدائم على المضيف) — تُحذف الأقدم من 14 يومًا
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        echo "[db-backup] hourly pg_dump → /backups (keep latest 2)"
        # كل ساعة: pg_dump → ملف مؤقت → فحص نجاح وحجم → ضغط → احتفظ بأحدث نسختين فقط
        # عند الفشل: إعادة المحاولة بعد دقيقة
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          tmp="/backups/.tmp-$ts.sql"
          out="/backups/auto-erp_db-$$ts.sql.gz"
          if pg_dump -h db -U erp -d erp_db > "$$tmp" && [ -s "$$tmp" ]; then
            gzip -c "$$tmp" > "$$out" && rm -f "$$tmp"
            echo "[$$(date)] backup OK: $$out"
            # أقدم من أحدث نسختين يُحذف
            ls -1t /backups/auto-erp_db-*.sql.gz 2>/dev/null | tail -n +3 | while read f; do rm -f "$$f"; done
            sleep 3600
          else
            rm -f "$$tmp"
            echo "[$$(date)] backup FAILED — retry in 60s"
            sleep 60
          fi
        done

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://erp:${POSTGRES_PASSWORD}@db:5432/erp_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      LICENSE_RENEWAL_PASSWORD: ${LICENSE_RENEWAL_PASSWORD:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COMPANY_NAME: ${COMPANY_NAME:-MOZAD ERP}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      CURRENCY_LABEL: ${CURRENCY_LABEL:-ج.م}
      EXPORT_TIMEZONE: ${EXPORT_TIMEZONE:-Africa/Cairo}
      # dev فقط: إنشاء الجداول الناقصة تلقائياً عند الإقلاع (الإنتاج يعتمد Alembic — القيمة الافتراضية false)
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      ETA_ENC_KEY: ${ETA_ENC_KEY:-}
      # النسخ الاحتياطية: داخل الحاوية وعلى القرص المضيف (./backups) — لا تضيع عند إعادة الإنشاء
      BACKUP_DIR: /srv/backups
    volumes:
      - ./backups:/srv/backups
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    image: mozad-erp-frontend:local
    container_name: mozad-erp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
